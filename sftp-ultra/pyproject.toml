[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sftp-ultra"
version = "1.0.0"
description = "Resumable, concurrent, manifest-driven SFTP transfer engine"
requires-python = ">=3.11"
dependencies = [
  "paramiko>=3.4",
]

[project.scripts]
sftp-ultra = "sftp_ultra.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
